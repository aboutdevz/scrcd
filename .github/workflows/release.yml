name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run exporter tests
        run: npm test

      - name: Build native Windows helper tools
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools/build-tools.ps1

      - name: Build frontend bundle
        run: npm run build

      - name: Package Windows executable & installer
        shell: powershell
        run: npx electron-builder --win nsis portable --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean unnecessary files & generate SHA-256 Checksums
        shell: powershell
        run: |
          Get-ChildItem -Path release -File | Where-Object { $_.Extension -notin @('.exe') } | Remove-Item -Force -ErrorAction SilentlyContinue
          cd release
          Get-FileHash -Algorithm SHA256 *.exe | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Out-File -Encoding ascii SHA256SUMS.txt
          Write-Host "--- Clean Release Assets ---"
          Get-ChildItem -Path . -File | Select-Object Name, Length
          Write-Host "--- SHA256SUMS ---"
          Get-Content SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag_name != ''
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            release/*.exe
            release/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
