name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test & Build Verification
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run exporter tests
        run: npm test

      - name: Build native helper tools
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools/build-tools.ps1

      - name: Typecheck and build frontend
        run: npm run build
